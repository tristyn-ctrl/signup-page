<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Art & Design Club </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Day1: Header-->
    <header>
     <h1>Art & Design Club</h1>
     <p>Come design something cool!</p>
</header>
<!-- Day1: Nav Bar-->
<nav>
    <a href="#about">About</a>
    <a href="#schedule">Schedule</a>
    <a href="#join">Join</a>
</nav>
<!-- Day1: Main 3 Sections-->
<main>
    <!--Section 1-->
    <section id="about" class="box">
      <h2>
        Draw, paint, design.
    </h2>
   <p>Art & Design club </p>
    
</section>
    <!--Section 2-->
    <section id="schedule" class="box">
      <h2>
      When we Meet
      </h2>
       <p> We meet every Wednesday at 3PM  </p>
       <p> Fill out the form to register for Art and Design Club! </p>

       <!--Next Meeting Button -->
       <button id="next-btn">When is the next meeting?</button>
       <p id="next-meeting"></p>
       
    </section>
    <!--Section 3-->
    <section id="join" class="box">
      <h2>
       Join Us!
      </h2>
    
       <!--Sign Up form-->
       <form>
  <label for="name">Your Name: </label>
  <input type="text" id="name" name="name"placeholder="Jane Doe" required>

  <label for="email">Your Email: </label>
  <input type="email" id="email" name="email" placeholder="you@example.com" >
  
  <label for =Artist Level>Artist Level</label>
  <select id="Artist Level" name="Artist Level">
  <option value="___">Beginner</option>
  <option value="___">Intermediate</option>
  <option value="___">Advanced</option>
</select>

  <label for ="message">Anything we should know?</label>
  <textarea id="message" name="message" rows="4"></textarea>
  
  <button type="submit">Sign me up!</button>
      </form>

</section>
</main>

<!--Footer-->

<footer>
    <p>Created By: Tristyn Corbin @ CodeX Academy &copy; 2026</p>
</footer>

<!--Linking JS-->
<script src="script.js"></script>

</body>
</html>
